<!DOCTYPE html>
<html lang="en">
<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	
	<!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
	
	<!-- link to main stylesheet -->
	<link rel="stylesheet" type="text/css" href="/assets/css/main.css">

</head>

<body>
<header class="site-header px-responsive">
  <div style = "background-color:#084594; background-image:url('../assets/img/bg.png'); background-size: cover;">
      <div class="text-center">
      <a href="{{ "/" | relative_url}}"><img src="{{ "/assets/img/logo.png" | relative_url}}" alt="PinPath" class = "center" 
		style="width:500px;max-width:80%;height:auto;margin-top:40px;margin-bottom:20px;">
		<nav class="">
        <ul style = " list-style: none; padding: 0; margin: 0 auto; justify-content: center;">
          {% assign current = page.url | downcase | split: '/' %}
          
          <li class="text-center d-block d-sm-inline-block px-5 px-md-3">
          	<a class="nav-underline {% if page.url == '/' %}current{% endif %}" href="{{ '/' | relative_url }}" style="color: white; font-size: 24px"><b>Home</b></a>
          </li>
          
          <li class="text-center d-block d-sm-inline-block px-5 px-md-3">
          	<a class="nav-underline {% if page.url contains '/about' %}current{% endif %}" href="{{ '/about/' | relative_url }}" style="color: white; font-size: 24px"><b>About</b></a>
          </li>
          
          <li class="text-center d-block d-sm-inline-block px-5 px-md-3">
          	<a class="nav-underline Web app {% if page.url contains '/web-app' %}current{% endif %}" href="{{ '/web-app/' | relative_url }}" style="color: white; font-size: 24px"><b>Web app</b></a>
          </li>
          
          <li class="text-center d-block d-sm-inline-block px-5 px-md-3">
          	 <a class="nav-underline Documentation {% if page.url contains '/documentation/' %}current{% endif %}" href="{{ '/documentation/' | relative_url }}" style="color: white; font-size: 24px"><b>Documentation</b></a>
          </li>
          
        </ul>
        </nav>
        <br>
      </div>
</div>
</header>
</body>
